[project]
name = "ml-rrdemo"
version = "0.1.0"
description = "Solder defect detection / classification experiments"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.11",
    "torchvision>=0.26",
    "torchmetrics",
    "pycocotools",
    "pillow",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = ["ipykernel"]

# CUDA 12.8 builds of PyTorch (Windows/Linux); macOS falls back to PyPI.
[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }
torchvision = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
